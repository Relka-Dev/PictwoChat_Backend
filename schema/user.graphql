type User {
    _id: ID!
    username: String!
    email: String!
    createdAt: String!
}

type AuthPayload {
    token: String
    message: String
}

extend type Query {
    users: [User]
}

extend type Mutation {
    register(username: String!, email: String!, password: String!): AuthPayload
    login(email: String!, password: String!): AuthPayload
}