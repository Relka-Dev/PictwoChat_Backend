type User {
    _id: ID!
    username: String!
    email: String!
    createdAt: String!
    pfp: String
}

type AuthPayload {
    token: String
    message: String
}

extend type Query {
    users: [User]
    profile: User
}

extend type Mutation {
    register(username: String!, email: String!, password: String!): AuthPayload
    login(email: String!, password: String!): AuthPayload
    updateProfile(username: String!, email: String!, pfp: String): User
}